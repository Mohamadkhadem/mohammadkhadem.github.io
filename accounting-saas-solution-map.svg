<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">OrashMIS backend solution map</title>
  <desc id="description">Visible solution structure with the OrashMIS API, its four controller groups, and five Core projects.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2ff"/>
      <stop offset="1" stop-color="#f8f9fc"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#263b68" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1440" height="900" rx="34" fill="url(#wash)"/>
  <circle cx="1310" cy="100" r="190" fill="#4169e1" opacity=".045"/>
  <circle cx="115" cy="825" r="200" fill="#7c5cff" opacity=".035"/>

  <text x="80" y="86" fill="#4169e1" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.4">ACCOUNTING SAAS · BACKEND</text>
  <text x="80" y="142" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2">OrashMIS solution map</text>
  <text x="80" y="178" fill="#5e6b80" font-family="Inter, Arial, sans-serif" font-size="18">A clear view of the API groups and Core projects visible in Solution Explorer</text>

  <rect x="70" y="218" width="1300" height="300" rx="25" fill="#fff" stroke="#dfe6f2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="218" width="1300" height="82" rx="25" fill="#111827"/>
  <path d="M70 275v25h1300v-25" fill="#111827"/>
  <rect x="100" y="238" width="42" height="42" rx="12" fill="#4169e1"/>
  <path d="M111 250h20v17h-20zM115 246h12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="257" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">OrashMIS.API</text>
  <text x="160" y="282" fill="#c6d1e4" font-family="Inter, Arial, sans-serif" font-size="15">ASP.NET Core API project</text>

  <rect x="930" y="239" width="176" height="40" rx="12" fill="#ffffff" fill-opacity=".11" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="1018" y="265" text-anchor="middle" fill="#e8eefb" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">Program.cs</text>
  <rect x="1120" y="239" width="220" height="40" rx="12" fill="#ffffff" fill-opacity=".11" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="1230" y="265" text-anchor="middle" fill="#e8eefb" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">Middlewares</text>

  <text x="110" y="346" fill="#5e6b80" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">CONTROLLER GROUPS</text>
  <text x="110" y="371" fill="#8490a3" font-family="Inter, Arial, sans-serif" font-size="14">Organized inside the API project</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="110" y="399" width="285" height="78" rx="16" fill="#f3f6ff" stroke="#dce5ff" stroke-width="2"/>
    <circle cx="140" cy="438" r="8" fill="#4169e1"/><text x="162" y="444" fill="#243451" font-size="17" font-weight="700">BasicCore</text>
    <rect x="420" y="399" width="285" height="78" rx="16" fill="#f3f6ff" stroke="#dce5ff" stroke-width="2"/>
    <circle cx="450" cy="438" r="8" fill="#4169e1"/><text x="472" y="444" fill="#243451" font-size="17" font-weight="700">ApplicationCore</text>
    <rect x="730" y="399" width="285" height="78" rx="16" fill="#f3f6ff" stroke="#dce5ff" stroke-width="2"/>
    <circle cx="760" cy="438" r="8" fill="#4169e1"/><text x="782" y="444" fill="#243451" font-size="17" font-weight="700">AccountingCore</text>
    <rect x="1040" y="399" width="285" height="78" rx="16" fill="#f3f6ff" stroke="#dce5ff" stroke-width="2"/>
    <circle cx="1070" cy="438" r="8" fill="#4169e1"/><text x="1092" y="444" fill="#243451" font-size="17" font-weight="700">InfraCore</text>
  </g>

  <text x="80" y="592" fill="#4169e1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.7">CORE PROJECTS</text>
  <text x="80" y="623" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Separate project modules in the solution</text>
  <text x="80" y="650" fill="#5e6b80" font-family="Inter, Arial, sans-serif" font-size="15">Grouped as shown in the visible Solution Explorer tree</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="690" width="240" height="132" rx="18" fill="#fff" stroke="#e1e7f1" stroke-width="2"/>
    <rect x="70" y="690" width="240" height="6" rx="3" fill="#4169e1"/>
    <text x="92" y="739" fill="#8490a3" font-size="12" font-weight="800" letter-spacing="1">CORE MODULE</text>
    <text x="92" y="779" fill="#182338" font-size="17" font-weight="750">OrashMIS.Accounting</text>
    <text x="92" y="803" fill="#4169e1" font-size="15" font-weight="700">.Core</text>

    <rect x="330" y="690" width="240" height="132" rx="18" fill="#fff" stroke="#e1e7f1" stroke-width="2"/>
    <rect x="330" y="690" width="240" height="6" rx="3" fill="#7c5cff"/>
    <text x="352" y="739" fill="#8490a3" font-size="12" font-weight="800" letter-spacing="1">CORE MODULE</text>
    <text x="352" y="779" fill="#182338" font-size="17" font-weight="750">OrashMIS.Application</text>
    <text x="352" y="803" fill="#7c5cff" font-size="15" font-weight="700">.Core</text>

    <rect x="590" y="690" width="240" height="132" rx="18" fill="#fff" stroke="#e1e7f1" stroke-width="2"/>
    <rect x="590" y="690" width="240" height="6" rx="3" fill="#25a887"/>
    <text x="612" y="739" fill="#8490a3" font-size="12" font-weight="800" letter-spacing="1">CORE MODULE</text>
    <text x="612" y="779" fill="#182338" font-size="17" font-weight="750">OrashMIS.Basic.Core</text>
    <text x="612" y="803" fill="#25a887" font-size="15" font-weight="700">Shared business basics</text>

    <rect x="850" y="690" width="240" height="132" rx="18" fill="#fff" stroke="#e1e7f1" stroke-width="2"/>
    <rect x="850" y="690" width="240" height="6" rx="3" fill="#e39a35"/>
    <text x="872" y="739" fill="#8490a3" font-size="12" font-weight="800" letter-spacing="1">CORE MODULE</text>
    <text x="872" y="779" fill="#182338" font-size="17" font-weight="750">OrashMIS.Infra.Core</text>
    <text x="872" y="803" fill="#e39a35" font-size="15" font-weight="700">Infrastructure</text>

    <rect x="1110" y="690" width="260" height="132" rx="18" fill="#fff" stroke="#e1e7f1" stroke-width="2"/>
    <rect x="1110" y="690" width="260" height="6" rx="3" fill="#a05fc9"/>
    <text x="1132" y="739" fill="#8490a3" font-size="12" font-weight="800" letter-spacing="1">CORE MODULE</text>
    <text x="1132" y="779" fill="#182338" font-size="17" font-weight="750">OrashMIS.Shared.Core</text>
    <text x="1132" y="803" fill="#a05fc9" font-size="15" font-weight="700">Shared contracts &amp; models</text>
